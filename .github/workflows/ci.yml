name: CI

on:
  push:
    branches:
      - bet
      - bluff
  pull_request:
    branches:
      - bet
      - bluff
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promotion-source:
    name: promotion-source
    if: github.event_name == 'pull_request' && github.base_ref == 'bet'
    runs-on: ubuntu-24.04
    steps:
      - name: Require bluff as the production promotion source
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_BRANCH" != "bluff" ]]; then
            echo "Pull requests into bet must promote the persistent bluff branch." >&2
            exit 1
          fi

  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check shell syntax
        run: |
          for script in bootstrap.sh bin/nvim-config scripts/dev-plugins.sh scripts/ci/*.sh; do
            bash -n "$script"
          done

      - name: Run ShellCheck
        run: shellcheck bootstrap.sh bin/nvim-config scripts/dev-plugins.sh scripts/ci/*.sh

      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD

  debian-smoke:
    name: debian-smoke
    runs-on: ubuntu-24.04
    container: debian:13-slim
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install test prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl git gzip tar xz-utils

      - name: Install pinned Neovim
        env:
          NVIM_SHA256: 012bf3fcac5ade43914df3f174668bf64d05e049a4f032a388c027b1ebd78628
          NVIM_URL: https://github.com/neovim/neovim/releases/download/v0.12.4/nvim-linux-x86_64.tar.gz
        run: |
          curl --fail --location --retry 3 "$NVIM_URL" --output /tmp/nvim.tar.gz
          echo "$NVIM_SHA256  /tmp/nvim.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/nvim.tar.gz --directory /opt
          ln --symbolic /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          nvim --version | head -n 1

      - name: Compile every Lua file
        run: nvim --headless --clean -l scripts/ci/check-lua.lua .

      - name: Smoke-test local desktop policy
        run: nvim --headless --clean -l scripts/ci/smoke-core.lua . native

      - name: Smoke-test headless SSH policy
        env:
          SSH_TTY: /dev/pts/0
        run: nvim --headless --clean -l scripts/ci/smoke-core.lua . osc52

  toolchain-compatibility:
    name: toolchain (Node ${{ matrix.node }} · ${{ matrix.channel }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            channel: floor
          - node: 24
            channel: recommended
          - node: 26
            channel: canary
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install tested Neovim
        env:
          NVIM_VERSION: v0.12.4
          NVIM_SHA256: 012bf3fcac5ade43914df3f174668bf64d05e049a4f032a388c027b1ebd78628
        run: |
          mkdir --parents "$RUNNER_TEMP/nvim"
          curl --fail --location --retry 3 \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz" \
            --output "$RUNNER_TEMP/nvim.tar.gz"
          echo "$NVIM_SHA256  $RUNNER_TEMP/nvim.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --strip-components=1 \
            --file "$RUNNER_TEMP/nvim.tar.gz" --directory "$RUNNER_TEMP/nvim"
          echo "$RUNNER_TEMP/nvim/bin" >> "$GITHUB_PATH"

      - name: Validate centralized toolchain policy
        run: |
          nvim --headless --clean -l scripts/toolchain.lua . validate
          test "$(nvim --headless --clean -l scripts/toolchain.lua . get node minimum_major)" = "22"
          test "$(nvim --headless --clean -l scripts/toolchain.lua . get node recommended_major)" = "24"
          test "$(nvim --headless --clean -l scripts/toolchain.lua . get node canary_major)" = "26"
          NVIM_CONFIG_DIR="$GITHUB_WORKSPACE" bin/nvim-config doctor --no-color

      - name: Exercise latest Node-backed tools
        run: |
          npx --yes prettier@latest --version
          npx --yes markdownlint-cli2@latest --version
          npx --yes pyright@latest --version
          npx --yes typescript-language-server@latest --version

      - name: Exercise safe whole-config updater
        if: matrix.channel == 'recommended'
        run: bash scripts/ci/test-update.sh

  bootstrap-smoke:
    name: bootstrap (Node 24 recommended)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure isolated XDG directories
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/nvim-config-xdg/config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/nvim-config-xdg/data" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/nvim-config-xdg/cache" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=$RUNNER_TEMP/nvim-config-xdg/state" >> "$GITHUB_ENV"
          echo "XDG_BIN_HOME=$RUNNER_TEMP/nvim-config-xdg/bin" >> "$GITHUB_ENV"

      - name: Install recommended Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install tested Neovim
        env:
          NVIM_VERSION: v0.12.4
          NVIM_SHA256: 012bf3fcac5ade43914df3f174668bf64d05e049a4f032a388c027b1ebd78628
        run: |
          mkdir --parents "$RUNNER_TEMP/nvim"
          curl --fail --location --retry 3 \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz" \
            --output "$RUNNER_TEMP/nvim.tar.gz"
          echo "$NVIM_SHA256  $RUNNER_TEMP/nvim.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --strip-components=1 \
            --file "$RUNNER_TEMP/nvim.tar.gz" --directory "$RUNNER_TEMP/nvim"
          echo "$RUNNER_TEMP/nvim/bin" >> "$GITHUB_PATH"

      - name: Prepare isolated config checkout
        run: |
          mkdir --parents "$XDG_CONFIG_HOME/nvim"
          cp --archive "$GITHUB_WORKSPACE/." "$XDG_CONFIG_HOME/nvim/"

      - name: Run the real installer
        run: "$XDG_CONFIG_HOME/nvim/bootstrap.sh"

      - name: Verify installed config and CLI
        run: |
          "$XDG_BIN_HOME/nvim-config" doctor --no-color
          nvim --headless +qa
